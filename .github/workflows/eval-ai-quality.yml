name: Evaluate AI plan quality (manual)

# P3 golden evaluation (specs/p3-ai-quality). Manual only.
# Uses the repository secret GEMINI_EVAL_KEY first (a SEPARATE Google project), then,
# on the Director's decision (2026-11-13), the production keys GEMINI_KEY_1..12 if they
# exist as GitHub Repository secrets — each at most `per_key_cap` requests per run, so
# teachers keep the rest of each project's daily quota. Generated plans are uploaded
# as a workflow artifact, never committed.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Prompt variants, comma-separated (v81 = production today, v80 = full PSI v8.0, v90 = PSI v9.0 draft) — or "probe" for Gemini diagnostics, or "probe-docs" for Google docs pages only (no quota), or "keycheck" = 1 tiny request per key and model'
        required: true
        default: 'v81,v80'
      limit:
        description: 'Max number of golden lessons (24 = all)'
        required: true
        default: '24'
      model:
        description: 'Model: production = exactly the live chain (2.5 Flash, then 3.5 Flash per key; DL-P18), or one model id, e.g. gemini-3.5-flash; Groq: groq:<model id> or groq:list'
        required: true
        default: 'gemini-2.5-flash'
      only:
        description: 'Optional: only these lesson ids, e.g. g08,g12'
        required: false
        default: ''
      per_key_cap:
        description: 'Max requests per PRODUCTION key in this run (teachers keep the rest of the daily quota)'
        required: false
        default: '4'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: PSI generated modules are in sync with the .md source
        run: node scripts/build-psi.mjs --check
      - name: Gemini diagnostics (models, quotas, deprecation notices)
        if: inputs.variants == 'probe' || inputs.variants == 'probe-docs'
        timeout-minutes: 20
        env:
          GEMINI_EVAL_KEY: ${{ secrets.GEMINI_EVAL_KEY }}
          PROBE_DOCS_ONLY: ${{ inputs.variants == 'probe-docs' && '1' || '0' }}
        run: deno run --allow-net --allow-env --allow-read --config supabase/functions/deno.json scripts/eval/probe.ts
      - name: Key health check (1 tiny request per key and model)
        if: inputs.variants == 'keycheck'
        timeout-minutes: 10
        env:
          GEMINI_EVAL_KEY: ${{ secrets.GEMINI_EVAL_KEY }}
          KEYCHECK_MODELS: ${{ inputs.model }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          GEMINI_KEY_6: ${{ secrets.GEMINI_KEY_6 }}
          GEMINI_KEY_7: ${{ secrets.GEMINI_KEY_7 }}
          GEMINI_KEY_8: ${{ secrets.GEMINI_KEY_8 }}
          GEMINI_KEY_9: ${{ secrets.GEMINI_KEY_9 }}
          GEMINI_KEY_10: ${{ secrets.GEMINI_KEY_10 }}
          GEMINI_KEY_11: ${{ secrets.GEMINI_KEY_11 }}
          GEMINI_KEY_12: ${{ secrets.GEMINI_KEY_12 }}
        run: deno run --allow-net --allow-env scripts/eval/keycheck.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run golden evaluation
        if: inputs.variants != 'probe' && inputs.variants != 'probe-docs' && inputs.variants != 'keycheck'
        env:
          GEMINI_EVAL_KEY: ${{ secrets.GEMINI_EVAL_KEY }}
          GROQ_EVAL_KEY: ${{ secrets.GROQ_EVAL_KEY }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          GEMINI_KEY_6: ${{ secrets.GEMINI_KEY_6 }}
          GEMINI_KEY_7: ${{ secrets.GEMINI_KEY_7 }}
          GEMINI_KEY_8: ${{ secrets.GEMINI_KEY_8 }}
          GEMINI_KEY_9: ${{ secrets.GEMINI_KEY_9 }}
          GEMINI_KEY_10: ${{ secrets.GEMINI_KEY_10 }}
          GEMINI_KEY_11: ${{ secrets.GEMINI_KEY_11 }}
          GEMINI_KEY_12: ${{ secrets.GEMINI_KEY_12 }}
        run: |
          case "${{ inputs.model }}" in
            groq:*) if [ -z "$GROQ_EVAL_KEY" ]; then echo "::error::Repository secret GROQ_EVAL_KEY is missing."; exit 1; fi ;;
            *) if [ -z "$GEMINI_EVAL_KEY$GEMINI_KEY_1" ]; then echo "::error::No Gemini key: add GEMINI_EVAL_KEY or GEMINI_KEY_1 as a Repository secret."; exit 1; fi ;;
          esac
          deno run --allow-net --allow-read --allow-write --allow-env \
            --config supabase/functions/deno.json scripts/eval/run.ts \
            --variants "${{ inputs.variants }}" --limit "${{ inputs.limit }}" --only "${{ inputs.only }}" --model "${{ inputs.model }}" --per-key-cap "${{ inputs.per_key_cap || '4' }}" --out eval-out
      - name: Summary
        if: always()
        run: |
          test -f eval-out/report.md && cat eval-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
          # Full plan texts for the Director's reading (generated lesson plans only, no personal data)
          for f in eval-out/plans/*/*.txt; do
            [ -f "$f" ] || continue
            { echo; echo "<details><summary><b>$(basename "$(dirname "$f")") / $(basename "$f" .txt)</b> (click to open)</summary>"; echo; echo '```text'; cat "$f"; echo; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.run_number }}
          path: eval-out/
          retention-days: 30

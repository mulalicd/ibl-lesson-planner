name: Deploy Edge Function

# Deploy of supabase/functions/ibl-chat to PRODUCTION (pfwxbsucgjlnimvxbpyk).
# AUTOMATIC on every push to main that touches the function or its shared code
# (Director decision 2026-11-10, "automatski deploy da"), and only after the
# function's tests pass (Gate 0). Manual run (type DEPLOY) stays as a fallback.
# Requires the repository secret SUPABASE_ACCESS_TOKEN (Supabase account ->
# Access Tokens). Edge Function secrets (GEMINI_KEY_*, ALLOWED_ORIGINS) are
# set in the Supabase dashboard, never here.
#
# Safety gates (P1 rollout order, ROLLOUT_DIREKTOR.md):
#   1. token present            -> otherwise stop with a clear message
#   2. SQL step A applied       -> consume_ai_quota() must exist, else the new
#                                  function would refuse every AI request
#   3. required secrets exist   -> ALLOWED_ORIGINS and GEMINI_KEY_1
#   4. after deploy: CORS answers for the production origin

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'src/lib/validation/schemas.ts'
      - '.github/workflows/deploy-edge-function.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy ibl-chat to production'
        required: true
      verify_jwt:
        description: 'Platform JWT check (keep "on"; use "off" only if every signed-in call fails with Invalid JWT — the function still checks the user itself)'
        required: true
        default: 'on'
        type: choice
        options: ['on', 'off']

env:
  PROJECT_REF: pfwxbsucgjlnimvxbpyk
  SUPABASE_URL: https://pfwxbsucgjlnimvxbpyk.supabase.co
  # Publishable (public) key — the same value every visitor's browser receives.
  PUBLISHABLE_KEY: sb_publishable_R3bb3reMeXTkdizB16ae-w_iRqtyOvd
  PROD_ORIGIN: https://ibl-lesson-planner.vercel.app

# Never two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-edge-function
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'DEPLOY')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Gate 0 — the function's tests pass (nothing is deployed otherwise)"
        run: |
          node scripts/build-psi.mjs --check
          deno check --config supabase/functions/deno.json supabase/functions/ibl-chat/index.ts
          deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared/
          deno run --allow-net --allow-env --allow-run --allow-read --config supabase/functions/deno.json supabase/tests/edge/ibl-chat.e2e.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: "Gate 1 — access token present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing (Settings -> Secrets and variables -> Actions). Nothing was deployed."
            exit 1
          fi

      - name: "Gate 2 — SQL step A applied (consume_ai_quota exists)"
        run: |
          # Anonymous call: after step A the function exists but anon may not
          # execute it (permission error = OK). Only "function not found"
          # (PGRST202) means step A is missing. The call never runs the quota.
          body=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/consume_ai_quota" \
            -H "apikey: $PUBLISHABLE_KEY" -H "Content-Type: application/json" --data '{}')
          echo "probe: $body"
          if echo "$body" | grep -q '"PGRST202"'; then
            echo "::error::SQL step A (2026-11-06_p1-a-roles-ownership) is not applied yet. Run it first (ROLLOUT_DIREKTOR.md step 6). Nothing was deployed."
            exit 1
          fi

      - name: "Gate 3 — required Edge Function secrets exist"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ! out=$(supabase secrets list --project-ref "$PROJECT_REF" -o json 2>&1); then
            echo "$out"
            if echo "$out" | grep -q "edge_functions_secrets_read"; then
              # Token may deploy but not read secrets. Existence of ALLOWED_ORIGINS and
              # GEMINI_KEY_1 was verified in run #3 (2026-11-06 23:03); the post-deploy
              # CORS check below detects a missing ALLOWED_ORIGINS.
              echo "::warning::Token cannot read secrets (edge_functions_secrets_read). Skipping this gate; the post-deploy check verifies ALLOWED_ORIGINS."
              exit 0
            fi
            echo "::error::Could not read Edge Function secrets — the SUPABASE_ACCESS_TOKEN is invalid or expired (see the line above). Nothing was deployed."
            exit 1
          fi
          names=$(echo "$out" | jq -r '.[].name')
          missing=""
          for s in ALLOWED_ORIGINS GEMINI_KEY_1; do echo "$names" | grep -qx "$s" || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing Edge Function secret(s):$missing (Supabase -> Edge Functions -> Secrets). Nothing was deployed."
            exit 1
          fi
          echo "secrets present: ALLOWED_ORIGINS, GEMINI_KEY_1"

      - name: Deploy ibl-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.verify_jwt }}" = "off" ]; then EXTRA="--no-verify-jwt"; else EXTRA=""; fi
          # --yes: the CLI asks for confirmation and cannot in CI ("Nothing was changed" otherwise).
          # Choosing to run this workflow with DEPLOY is the confirmation.
          supabase functions deploy ibl-chat --project-ref "$PROJECT_REF" --yes $EXTRA

      - name: "Check — CORS answers for the production origin"
        run: |
          sleep 10
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS "$SUPABASE_URL/functions/v1/ibl-chat" -H "Origin: $PROD_ORIGIN" -H "Access-Control-Request-Method: POST")
          echo "preflight HTTP $code"
          allow=$(curl -sS -o /dev/null -D - -X OPTIONS "$SUPABASE_URL/functions/v1/ibl-chat" -H "Origin: $PROD_ORIGIN" -H "Access-Control-Request-Method: POST" | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
          echo "allow-origin: ${allow:-<none>}"
          if [ "$allow" != "$PROD_ORIGIN" ]; then
            echo "::error::The new function does not allow $PROD_ORIGIN — ALLOWED_ORIGINS is missing or wrong (Supabase -> Edge Functions -> Secrets). The AI planner will not work in the browser until it is fixed."
            exit 1
          fi

      - name: "Check — an anonymous call is still refused (auth intact)"
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/ibl-chat" -H "Content-Type: application/json" --data '{}')
          echo "anonymous POST HTTP $code"
          if [ "$code" != "401" ]; then
            echo "::error::The deployed function did not refuse an anonymous call (expected 401, got $code). Roll back: run this workflow manually on the previous good commit."
            exit 1
          fi
